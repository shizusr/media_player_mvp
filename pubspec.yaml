name: media_player_mvp
description: MVP кроссплатформенного медиаплеера на Flutter с media_kit.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_macos_video: ^1.1.4

  youtube_explode_dart: ^3.1.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true