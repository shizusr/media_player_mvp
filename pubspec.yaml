name: media_player_mvp
description: Media catalog with persistent library, categories and streaming via media_kit and yt-dlp.
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_macos_video: ^1.1.4

  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.0
  desktop_drop: '>=0.5.0 <1.0.0'
  crypto: ^3.0.3
  xml: ^6.5.0

  # Cinema tab (isolated from the YouTube part)
  dio: ^5.7.0
  flutter_inappwebview: ^6.2.0-beta.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
